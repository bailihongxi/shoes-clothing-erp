<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3FB89B">
<title>我的鞋服店 · 进销存记账</title>
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/print.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<div id="app">
  <aside class="app-sidebar">
    <div class="brand">👟 <span>我的鞋服店</span></div>
    <nav class="nav-list"></nav>
  </aside>

  <div class="app-column">
    <header class="app-header">
      <span class="brand">我的鞋服店</span>
      <span class="sub">进销存记账</span>
    </header>
    <!-- 电脑端顶栏（v2）：店名 + 全局搜索 + 铃铛 + 头像，由 app.renderNav 填充 -->
    <div class="top-bar">
      <span class="shop-name" id="top-shop-name">我的鞋服店</span>
      <div class="global-search">
        <span class="ico">🔍</span>
        <input id="global-search-input" type="search" placeholder="全局搜索商品 / 订单 / 客户" autocomplete="off">
      </div>
      <div class="spacer"></div>
      <button class="bell" data-act="go" data-page="report" aria-label="通知" title="经营概览">
        🔔<span class="dot hidden" id="top-bell-dot"></span>
      </button>
      <div class="avatar" id="top-avatar" data-act="go" data-page="mine" title="我的"><img src="assets/icon-192.png" alt="我的"></div>
    </div>
    <main class="app-main">
      <div id="view"></div>
    </main>
  </div>

  <nav class="app-tabbar"></nav>
</div>

<div id="toast-wrap"></div>

<!-- ============ 核心基础层（无依赖） ============ -->
<script src="js/core/util.js"></script>
<script src="js/core/schema.js"></script>
<script src="js/core/accounts.js"></script>
<script src="js/core/legacy-migrate.js"></script>

<!-- ============ 核心逻辑层（依赖 schema） ============ -->
<script src="js/core/coding.js"></script>
<script src="js/core/docNo.js"></script>
<script src="js/core/inventory.js"></script>
<script src="js/core/ledger.js"></script>
<script src="js/core/debt.js"></script>
<script src="js/core/profit.js"></script>
<script src="js/core/backup.js"></script>
<script src="js/core/barcode.js"></script>
<script src="js/core/sync.js"></script>
<script src="js/core/cart.js"></script>

<!-- ============ 存储层（依赖 core/schema） ============ -->
<script src="js/store/db.js"></script>
<script src="js/store/repo.js"></script>

<!-- ============ 业务引擎（依赖 core/* + store/*，用 writeLog 兜底延迟读 ERP.repo） ============ -->
<script src="js/core/engine.js"></script>

<!-- ============ 条码渲染/标签/蓝牙打印（界面层依赖 render/label/printBt，须先加载） ============ -->
<script src="vendor/zxing.min.js" defer></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/core/excel.js"></script>
<script src="js/barcode/render.js"></script>
<script src="js/barcode/label.js"></script>
<script src="js/barcode/print-bt.js"></script>

<!-- ============ 界面层 ============ -->
<script src="js/ui/router.js"></script>
<script src="js/ui/components.js"></script>
<script src="js/ui/page-home.js"></script>
<script src="js/ui/page-product.js"></script>
<script src="js/ui/page-purchase.js"></script>
<script src="js/ui/page-sale.js"></script>
<script src="js/ui/page-exchange.js"></script>
<script src="js/ui/page-inventory.js"></script>
<script src="js/ui/page-account.js"></script>
<script src="js/ui/page-supplier.js"></script>
<script src="js/ui/page-report.js"></script>
<script src="js/ui/page-setting.js"></script>
<script src="js/ui/page-mine.js"></script>
<script src="js/ui/page-login.js"></script>

<!-- ============ 条码扫描（依赖界面层 components） ============ -->
<script src="js/barcode/scan.js"></script>

<!-- ============ 启动 ============ -->
<script src="js/app.js"></script>
<script>
  // 注册 Service Worker（仅 https 托管生效；file:// 双击静默跳过）
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
