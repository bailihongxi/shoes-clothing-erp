<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>我的鞋服店 · 进销存记账</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/print.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<div id="app">
  <aside class="app-sidebar">
    <div class="brand">👟 <span>我的鞋服店</span></div>
    <nav class="nav-list"></nav>
  </aside>

  <div class="app-column">
    <header class="app-header">
      <span class="brand">我的鞋服店</span>
      <span class="sub">进销存记账</span>
    </header>
    <main class="app-main">
      <div id="view"></div>
    </main>
  </div>

  <nav class="app-tabbar"></nav>
</div>

<div id="toast-wrap"></div>

<!-- ============ 核心逻辑层（纯函数，可在 Node 中测试） ============ -->
<script src="js/core/util.js"></script>
<script src="js/core/schema.js"></script>
<script src="js/core/coding.js"></script>
<script src="js/core/docNo.js"></script>
<script src="js/core/inventory.js"></script>
<script src="js/core/ledger.js"></script>
<script src="js/core/debt.js"></script>
<script src="js/core/profit.js"></script>
<script src="js/core/backup.js"></script>
<script src="js/core/barcode.js"></script>
<script src="js/core/sync.js"></script>
<script src="js/core/cart.js"></script>
<script src="js/core/engine.js"></script>

<!-- ============ 存储层 ============ -->
<script src="js/store/db.js"></script>
<script src="js/store/repo.js"></script>

<!-- ============ 界面层 ============ -->
<script src="js/ui/router.js"></script>
<script src="js/ui/components.js"></script>
<script src="js/ui/page-home.js"></script>
<script src="js/ui/page-product.js"></script>
<script src="js/ui/page-purchase.js"></script>
<script src="js/ui/page-sale.js"></script>
<script src="js/ui/page-inventory.js"></script>
<script src="js/ui/page-account.js"></script>
<script src="js/ui/page-report.js"></script>
<script src="js/ui/page-setting.js"></script>

<script src="js/barcode/scan.js"></script>

<!-- ============ 启动 ============ -->
<script src="js/app.js"></script>
<script>
  // 注册 Service Worker（仅 https 托管生效；file:// 双击静默跳过）
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
